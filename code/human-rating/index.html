<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>見比べ採点</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--sub:#6a7181;--line:#dfe2e8;--accent:#2f6fed;--pick:#e8f0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Hiragino Sans",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center}
header b{font-size:16px}#prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}#bar{height:100%;background:var(--accent);width:0}
#count{color:var(--sub);font-variant-numeric:tabular-nums}
main{padding:16px 20px 120px;max-width:1700px;margin:auto}
.ask{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px}
.ask small{color:var(--sub);display:block;margin-bottom:2px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.app{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.app h3{margin:0;padding:8px 14px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.app h3 a{font-weight:400;font-size:13px;color:var(--accent)}
iframe{width:100%;height:62vh;border:0;display:block;background:#fff}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.c{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer;min-width:120px}
.c:hover{border-color:var(--accent)}.c.on{background:var(--pick);border-color:var(--accent);font-weight:600}
.c kbd{color:var(--sub);font-size:12px;margin-left:4px}
.nav{border:0;background:none;color:var(--accent);font-size:15px;cursor:pointer;padding:10px}
input#memo{width:260px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
#done{display:none;text-align:center;padding:80px 20px}#done h2{font-size:26px}
.help{color:var(--sub);font-size:13px;margin:0 0 10px}
@media (max-width:900px){.apps{grid-template-columns:1fr}}
</style></head><body>
<header><b>見比べ採点</b><div id="prog"><div id="bar"></div></div><span id="count"></span></header>
<main id="main">
  <p class="help">同じ頼みごとから作った2つのアプリです。実際に押したり入力したりして、<b>頼んだ人にとってどちらが良いか</b>を選んでください。コードを見る必要はありません。キーボードの 1〜5 でも選べます。</p>
  <div class="ask"><small>頼みごと</small><div id="prompt"></div></div>
  <div class="apps">
    <div class="app"><h3>左 <a id="openL" target="_blank">大きく開く ↗</a></h3><iframe id="L" sandbox="allow-scripts allow-modals allow-forms allow-pointer-lock"></iframe></div>
    <div class="app"><h3>右 <a id="openR" target="_blank">大きく開く ↗</a></h3><iframe id="R" sandbox="allow-scripts allow-modals allow-forms allow-pointer-lock"></iframe></div>
  </div>
</main>
<div id="done"><h2>おつかれさまでした！</h2><p>採点はすべて保存されました。Claude に「終わった」と伝えてください。</p></div>
<footer id="foot">
  <button class="nav" id="prev">← 前へ</button>
  <button class="c" data-v="-2">左がかなり良い<kbd>1</kbd></button>
  <button class="c" data-v="-1">左が少し良い<kbd>2</kbd></button>
  <button class="c" data-v="0">同じくらい<kbd>3</kbd></button>
  <button class="c" data-v="1">右が少し良い<kbd>4</kbd></button>
  <button class="c" data-v="2">右がかなり良い<kbd>5</kbd></button>
  <input id="memo" placeholder="ひとこと（なくてもOK）">
  <button class="nav" id="next">次へ →</button>
</footer>
<script>
let pairs=[],i=0,ans={};
const $=id=>document.getElementById(id);
async function save(){await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ans)});}
function show(){
  const done=Object.keys(ans).length;$('bar').style.width=(done/pairs.length*100)+'%';$('count').textContent=done+' / '+pairs.length;
  if(i>=pairs.length){$('main').style.display='none';$('foot').style.display='none';$('done').style.display='block';return;}
  $('main').style.display='';$('foot').style.display='';$('done').style.display='none';
  const p=pairs[i],a=ans[p.n];
  $('prompt').textContent='（'+(i+1)+'問目）'+p.prompt;
  for(const s of['L','R']){$(s).src=p.n+'-'+s+'.html';$('open'+s).href=p.n+'-'+s+'.html';}
  document.querySelectorAll('.c').forEach(b=>b.classList.toggle('on',a&&String(a.v)===b.dataset.v));
  $('memo').value=a?.memo||'';window.scrollTo(0,0);
}
async function pick(v){const p=pairs[i];ans[p.n]={v,memo:$('memo').value,at:new Date().toISOString()};await save();
  document.querySelectorAll('.c').forEach(b=>b.classList.toggle('on',b.dataset.v===String(v)));
  setTimeout(()=>{i++;while(i<pairs.length&&ans[pairs[i].n])i++;show();},250);}
document.querySelectorAll('.c').forEach(b=>b.onclick=()=>pick(Number(b.dataset.v)));
$('memo').onchange=()=>{const p=pairs[i];if(ans[p.n]){ans[p.n].memo=$('memo').value;save();}};
$('prev').onclick=()=>{if(i>0){i--;show();}};$('next').onclick=()=>{if(i<pairs.length){i++;show();}};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if('12345'.includes(e.key)&&e.key.length===1)pick(Number(e.key)-3);});
(async()=>{pairs=await(await fetch('pairs.json')).json();ans=await(await fetch('/ratings')).json();i=pairs.findIndex(p=>!ans[p.n]);if(i<0)i=pairs.length;show();})();
</script></body></html>
